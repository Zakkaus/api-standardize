paths:
  /api/v1/providers:
    get:
      operationId: listProviders
      summary: List provider metadata without credentials
      description: |
        Read current subscription, file and inline provider metadata; never fetch a
        subscription while serving a GET. Use the shared snapshot cursor semantics.
        The effective default limit is min(100, resources.providers.max_page_size).
        A limit above the advertised maximum returns 400 invalid_request, as does an
        unknown, expired or invalidated cursor. Restart the page walk without it.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/Limit1000
        - $ref: ./openapi.yaml#/components/parameters/Cursor
      responses:
        "200":
          description: Provider page
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ProviderList
              examples:
                providers:
                  value:
                    providers:
                      - id: provider-a
                        name: provider-a
                        kind: subscription
                        url_redacted: https://subscriptions.example.com/[redacted]
                        node_count: 1
                        updated_at: 2026-08-15T10:00:00Z
                        expires_at: 2026-10-01T00:00:00Z
                        traffic:
                          upload_bytes: "1048576"
                          download_bytes: "2097152"
                          total_bytes: "107374182400"
                        status: ok
                        last_error: null
                        download: { route: routing, group_id: null }
                    next_cursor: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          $ref: ./openapi.yaml#/components/responses/SnapshotUnavailable
    post:
      operationId: createProvider
      summary: Add a subscription provider to the managed configuration
      description: |
        Requires resources.providers.can_manage; otherwise returns 404
        capability_not_supported. Only kind subscription can be created here: file and
        inline providers are authored in the configuration sources. The backend writes
        the provider into the subscription section of its managed main source,
        advances the configuration revision, and emits generation.changed. A later
        replacement of that main source using its previous content_sha256 returns
        412 stale_revision. The provider is created unfetched: node_count 0, updated_at null and
        status stale; call POST /providers/{id}/refresh to load it. The URL is stored,
        never returned; the response carries url_redacted. A name already in use
        returns 409 state_conflict. A URL that is not HTTP(S) returns 422 unsupported_value.
        update_interval, user_agent and cache are accepted only when named in
        resources.providers.create_options; an omitted one takes the default listed there,
        and one the backend does not list returns 422 unsupported_value.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/ProviderCreate
            examples:
              subscription:
                value:
                  name: provider-b
                  kind: subscription
                  url: https://subscriptions.example.com/sub?token=secret
              options:
                value:
                  name: provider-c
                  kind: subscription
                  url: https://subscriptions.example.com/sub?token=secret
                  update_interval: 3600
                  user_agent: clash.meta
                  cache: false
      responses:
        "201":
          description: Provider written to the managed configuration
          headers:
            Location:
              description: The new provider's URL.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/providers/[^/]+$
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Provider
              examples:
                created:
                  value:
                    id: provider-b
                    name: provider-b
                    kind: subscription
                    url_redacted: https://subscriptions.example.com/[redacted]
                    node_count: 0
                    updated_at: null
                    expires_at: null
                    traffic: null
                    status: stale
                    last_error: null
                    download: { route: routing, group_id: null }
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/providers/provider-b
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: A provider with this name exists
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                name_taken:
                  value:
                    error:
                      code: state_conflict
                      message: A provider named provider-b already exists.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "413":
          description: Request body exceeds limits.max_json_body_bytes
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                too_large:
                  value:
                    error:
                      code: request_too_large
                      message: The request body exceeds the advertised limit.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "415":
          description: Request body is not application/json
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                unsupported:
                  value:
                    error:
                      code: unsupported_media_type
                      message: The request body must be application/json.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "422":
          description: The URL is not an http(s) URL
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                bad_url:
                  value:
                    error:
                      code: unsupported_value
                      message: The subscription URL must start with http:// or https://.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/providers/{id}:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProviderId
    get:
      operationId: getProvider
      summary: Read one provider's current metadata
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Provider metadata; reading does not refresh it
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/Provider
              examples:
                subscription:
                  value:
                    id: provider-a
                    name: provider-a
                    kind: subscription
                    url_redacted: https://subscriptions.example.com/[redacted]
                    node_count: 1
                    updated_at: 2026-08-15T10:00:00Z
                    expires_at: 2026-10-01T00:00:00Z
                    traffic:
                      upload_bytes: "1048576"
                      download_bytes: "2097152"
                      total_bytes: "107374182400"
                    status: ok
                    last_error: null
                    download: { route: routing, group_id: null }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
    delete:
      operationId: deleteProvider
      summary: Remove a subscription or file provider from the managed configuration
      description: |
        Requires resources.providers.can_manage; otherwise returns 404
        capability_not_supported, as does an inline provider, which is the node
        section itself. Removes the provider's line from the managed main source and
        its nodes from the running groups, advances the configuration revision and
        emits generation.changed. Idempotent: an unknown id returns deleted 0. A
        provider that is the only member source of a group is still removed; the
        group is then empty.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Idempotent deletion result
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/DeleteCount
              examples:
                deleted:
                  value:
                    deleted: 1
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "503":
          $ref: ./openapi.yaml#/components/responses/Unavailable
  /api/v1/providers/{id}/refresh:
    parameters:
      - $ref: ./openapi.yaml#/components/parameters/ProviderId
    post:
      operationId: refreshProvider
      summary: Queue a provider refresh
      description: |
        Requires resources.providers.can_refresh. This action takes no request body
        and never changes the provider's configured source. Unsupported provider kinds
        or refresh actions return 404 capability_not_supported. Follow the shared
        operation ownership, retention and idempotency rules. Replaying an accepted
        Idempotency-Key returns its original operation before checking for an in-flight
        refresh; a distinct refresh for the same provider returns 409 state_conflict.
        A full bounded queue returns 503 temporarily_unavailable with Retry-After.
        A successful provider_refresh operation returns the refreshed Provider in result;
        failure uses SafeError and leaves the last successfully loaded nodes intact.
        The fetch takes the provider's download route. When that route has no usable
        node yet, as when the routing rules send a subscription to a group of the nodes
        it has not delivered, the fetch fails with route_unavailable and never falls
        back to direct.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      responses:
        "202":
          description: Provider refresh accepted
          headers:
            Location:
              description: Operation status URL; equal to body href.
              required: true
              schema:
                type: string
                pattern: ^/api/v1/operations/[^/]+$
            Retry-After:
              description: Positive polling floor in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ProviderRefreshAccepted
              examples:
                queued:
                  value:
                    operation_id: op-provider-a
                    kind: provider_refresh
                    status: queued
                    href: /api/v1/operations/op-provider-a
                  x-headers:
                    Content-Type: application/json
                    Location: /api/v1/operations/op-provider-a
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          $ref: ./openapi.yaml#/components/responses/BadRequest
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: Another refresh for this provider is queued or running, or an idempotency key conflicts
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                in_flight:
                  value:
                    error:
                      code: state_conflict
                      message: A refresh for this provider is already queued or running.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                idempotency_conflict:
                  value:
                    error:
                      code: idempotency_conflict
                      message: The idempotency key was used with a different request.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "429":
          $ref: ./openapi.yaml#/components/responses/RateLimited
        "503":
          description: Provider refresh queue is full
          headers:
            Retry-After:
              description: Retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                queue_full:
                  value:
                    error:
                      code: temporarily_unavailable
                      message: The provider refresh queue is full.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
schemas:
  Provider:
    type: object
    required: [ id, name, kind, url_redacted, node_count, updated_at, expires_at, traffic, status, last_error ]
    properties:
      id:
        type: string
        minLength: 1
        description: Opaque provider identity, shared with Node.provider_id; not a URL or display name.
      name:
        type: string
        minLength: 1
      kind:
        type: string
        enum: [ subscription, file, inline ]
      url_redacted:
        type: [ string, "null" ]
        minLength: 1
        description: The configured source URL as written, with only listener-secret values (native_api.secret, clash_api.secret) masked. Null for file/inline sources. The wire name is kept for compatibility.
      node_count:
        $ref: ./openapi.yaml#/components/schemas/SafeUInt
      updated_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: Last successful load or refresh, or null if unknown or never loaded.
      expires_at:
        $ref: ./openapi.yaml#/components/schemas/NullableTimestamp
        description: Provider-reported expiry, or null when unavailable.
      traffic:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/ProviderTraffic
      status:
        type: string
        enum: [ ok, stale, error ]
        description: ok means current usable data is loaded. stale means the provider has not been fetched or retains older usable data. error means a failed load left no usable data.
      last_error:
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/SafeError
        description: The last failure, or null. A subscription fetch whose download route has no usable node yet reports code route_unavailable; other fetch failures report fetch_failed.
      download:
        description: The route a subscription's fetches take, with the values of the geodata download route. routing follows the routing rules like user traffic, group always goes through the group in group_id, and direct connects straight to the host. group_id is null for routing and direct and for a group that no longer exists. Null for file and inline providers. Backends that fetch subscriptions only directly omit it.
        oneOf:
          - type: "null"
          - $ref: ./openapi.yaml#/components/schemas/GeoDataDownload
    description: Safe metadata only. Names, URLs and last_error must not contain secrets, raw configuration or unredacted local paths.
  ProviderTraffic:
    type: object
    required: [ upload_bytes, download_bytes, total_bytes ]
    properties:
      upload_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      download_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
      total_bytes:
        $ref: ./openapi.yaml#/components/schemas/NullableUInt64
        description: Provider-reported total traffic allowance, not upload plus download. Null if unknown or unlimited.
    description: Provider-reported usage, not runtime counters. Each unavailable quantity is null; traffic itself may be null when no usage metadata exists.
  ProviderCreate:
    type: object
    additionalProperties: false
    required: [ name, kind, url ]
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_.-]+$
        description: The subscription tag as written in the configuration; unique among providers.
      kind:
        type: string
        const: subscription
      url:
        type: string
        minLength: 1
        maxLength: 4096
        pattern: ^https?://
        description: Fetched by the engine on refresh; stored in the managed main source and never returned.
      update_interval:
        type: integer
        minimum: 0
        maximum: 31536000
        description: Seconds between automatic refreshes; 0 refreshes only on request.
      user_agent:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[\x20-\x7E]+$
        description: User-Agent header sent when fetching the URL.
      cache:
        type: boolean
        description: Keep the last fetched body so the provider loads without the network at startup. false keeps none and removes a kept one.
  ProviderList:
    type: object
    required: [ providers, next_cursor ]
    properties:
      providers:
        type: array
        items:
          $ref: ./openapi.yaml#/components/schemas/Provider
      next_cursor:
        type: [ string, "null" ]
        minLength: 1
  ProviderRefreshAccepted:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationAccepted
      - type: object
        properties:
          kind:
            const: provider_refresh
  ProviderRefreshSucceededOperation:
    allOf:
      - $ref: ./openapi.yaml#/components/schemas/OperationCommon
      - type: object
        properties:
          kind:
            const: provider_refresh
          status:
            const: succeeded
          finished_at:
            $ref: ./openapi.yaml#/components/schemas/Timestamp
          result:
            $ref: ./openapi.yaml#/components/schemas/Provider
          error:
            type: "null"
