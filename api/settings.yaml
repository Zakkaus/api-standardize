paths:
  /api/v1/runtime/settings:
    get:
      operationId: getRuntimeSettings
      summary: Read the runtime-adjustable settings
      description: |
        Requires resources.runtime_settings.available. Returns the current
        runtime-adjustable settings. Numeric values cannot exceed their corresponding
        capability ceilings. source is config when values come from the activated
        configuration and runtime after a runtime override. geodata appears when
        resources.geodata.configurable_sources is true and carries its own source.
        GET needs only observe, so geodata URLs are returned as written only to an
        authenticated caller with control, which may edit them, and redacted like
        GeoAsset.source_redacted for everyone else.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Current runtime settings
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/RuntimeSettings
              examples:
                current:
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    source: config
                    log: { level: info, buffered_records: 4096 }
                    dns_log: { max_records: 2048 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                    geodata:
                      source: default
                      geosite:
                        urls:
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                      geoip:
                        urls:
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                      auto_update: { enabled: false, interval_hours: 24 }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                config_sources:
                  summary: Geodata URLs set in the configuration file
                  value:
                    observed_at: 2026-08-15T10:00:00Z
                    source: config
                    log: { level: info, buffered_records: 4096 }
                    dns_log: { max_records: 2048 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                    geodata:
                      source: config
                      geosite:
                        urls: [ https://mirror.example.net/geodata/geosite.dat ]
                      geoip:
                        urls: [ https://mirror.example.net/geodata/geoip.dat ]
                      auto_update: { enabled: true, interval_hours: 48 }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
    patch:
      operationId: patchRuntimeSettings
      summary: Change runtime-adjustable settings without a reload
      description: |
        Requires control and resources.runtime_settings.available; only the fields
        listed in resources.runtime_settings.fields may appear, others return 400
        invalid_request. The body is a merge: an absent field keeps its value. Every
        value is checked against its ceiling before anything changes; an unadvertised
        log level, a ring below 64 records, or a value above the ceiling returns 400
        and changes nothing. Shrinking a ring drops its oldest records and expires
        cursors older than the new floor. The change applies immediately and lasts
        until the process restarts or the next configuration activation resets it; it
        is not written to the configuration file.

        geodata is the exception. It requires resources.geodata.configurable_sources
        and an authenticated caller; the anonymous loopback principal gets 403
        permission_denied. The backend stores it, so it survives restarts and
        activations and does not change the top-level source. A geodata patch merges
        into the effective settings. Patching geosite or geoip stores both URL lists
        (geodata.source becomes db); auto_update is stored on its own; null deletes
        everything stored. It never downloads; POST /geodata/update does. While
        geodata.source is config the configuration file owns the URLs: a patch that
        sets geodata.geosite or geodata.geoip returns 409 state_conflict and changes
        nothing, while auto_update can still be patched.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: ./openapi.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./openapi.yaml#/components/schemas/RuntimeSettingsPatch
            examples:
              debug:
                value:
                  log: { level: debug }
                  dns_log: { max_records: 1024 }
              geodata_sources:
                summary: Use a mirror first and update daily
                value:
                  geodata:
                    geosite:
                      urls:
                        - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                        - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                    geoip:
                      urls:
                        - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                        - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                    auto_update: { enabled: true }
              geodata_auto_update:
                summary: Update every two days, also while the configuration file owns the URLs
                value:
                  geodata:
                    auto_update: { enabled: true, interval_hours: 48 }
              geodata_reset:
                summary: Return to the built-in sources
                value:
                  geodata: null
      responses:
        "200":
          description: Settings after the change
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/RuntimeSettings
              examples:
                changed:
                  value:
                    observed_at: 2026-08-15T10:00:05Z
                    source: runtime
                    log: { level: debug, buffered_records: 4096 }
                    dns_log: { max_records: 1024 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                geodata_stored:
                  value:
                    observed_at: 2026-08-15T10:00:05Z
                    source: config
                    log: { level: info, buffered_records: 4096 }
                    dns_log: { max_records: 2048 }
                    flows: { max_flows: 10000, retention_seconds: 300 }
                    geodata:
                      source: db
                      geosite:
                        urls:
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                      geoip:
                        urls:
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                      auto_update: { enabled: true, interval_hours: 24 }
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "400":
          description: A field outside resources.runtime_settings.fields, an unadvertised level, or a value outside its range
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                above_ceiling:
                  value:
                    error:
                      code: invalid_request
                      message: dns_log.max_records exceeds the advertised ceiling.
                    request_id: request-3
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        "401":
          $ref: ./openapi.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./openapi.yaml#/components/responses/Forbidden
        "404":
          $ref: ./openapi.yaml#/components/responses/NotFound
        "409":
          description: The patch sets geodata URLs while the configuration file owns them
          headers:
            Cache-Control:
              $ref: ./openapi.yaml#/components/headers/NoStore
            X-Content-Type-Options:
              $ref: ./openapi.yaml#/components/headers/NoSniff
          content:
            application/json:
              schema:
                $ref: ./openapi.yaml#/components/schemas/ErrorResponse
              examples:
                geodata_from_config:
                  value:
                    error:
                      code: state_conflict
                      message: Geodata URLs are set in the configuration file.
                      details: null
                    request_id: request-4
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
schemas:
  RuntimeSettingField:
    type: string
    enum: [ log.level, log.buffered_records, dns_log.max_records, flows.max_flows, flows.retention_seconds, record_flows, record_logs, record_dns_log, geodata ]
  RecorderMode:
    description: true pins a permitted recorder on, false forces it off, auto (the startup default) follows flow demand for record_flows and client attachment for the other recorders.
    oneOf:
      - type: boolean
      - type: string
        enum: [ auto ]
  RecorderState:
    type: object
    required: [ allowed, mode, active ]
    properties:
      allowed:
        type: boolean
        description: The configuration permits this recorder; false means never, whatever the mode.
      mode:
        type: string
        enum: [ auto, "on", "off" ]
      active:
        type: boolean
        description: The recorder is capturing right now.
  RuntimeSettings:
    type: object
    required: [ observed_at, source, log, dns_log, flows ]
    properties:
      observed_at:
        $ref: ./openapi.yaml#/components/schemas/Timestamp
      source:
        type: string
        enum: [ config, runtime ]
        description: config while every value comes from the activated configuration; runtime once any PATCH overrode one. geodata has its own source and does not affect this one.
      log:
        type: object
        required: [ level, buffered_records ]
        properties:
          level:
            $ref: ./openapi.yaml#/components/schemas/LogLevel
            description: Minimum severity the engine emits. A lower stream level cannot recover records the engine did not emit.
          buffered_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 64
            description: Log replay ring capacity, at most logs.max_buffered_records.
      dns_log:
        type: object
        required: [ max_records ]
        properties:
          max_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 64
            description: DNS log ring capacity, at most dns_log.max_records.
      flows:
        type: object
        required: [ max_flows, retention_seconds ]
        properties:
          max_flows:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 64
            description: Retained flows, at most flows.max_flows.
          retention_seconds:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
            description: Maximum age of a retained terminal flow, in seconds, bounded by resources.flows.retention_seconds. Capacity pressure may evict it earlier.
      recording:
        type: object
        required: [ flows, logs, dns_log, events, grace_remaining_seconds ]
        description: |
          Read-only recorder state. A client is attached while an admitted GET SSE stream on
          /events or /logs is open, or for 60 seconds after the last stream closed or a successful
          GET on /flows, /flows/{id} or /dns/log; other requests, including settings reads, do not
          renew attachment. Automatic log and DNS-log recorders follow attachment. The automatic
          flow recorder follows flow demand instead, so that an open panel does not record full
          flow traces for every connection: an admitted GET /events stream whose kinds include
          flow.updated or flow.gap, or that sets a nonblank flow_id with a flow kind in its
          effective kinds, holds demand while open and for 60 seconds after the last one closed,
          and a successful GET on /flows or /flows/{id} renews it for 60 seconds. Event streams
          without kinds, /logs streams and /dns/log reads do not create flow demand. Recording
          starts on attachment or demand, so the first history a client reads may be empty.
        properties:
          flows:
            $ref: ./openapi.yaml#/components/schemas/RecorderState
          logs:
            $ref: ./openapi.yaml#/components/schemas/RecorderState
          dns_log:
            $ref: ./openapi.yaml#/components/schemas/RecorderState
          events:
            type: object
            required: [ active ]
            properties:
              active:
                type: boolean
                description: Event capture runs while a client is attached or any permitted recorder is pinned on.
          grace_remaining_seconds:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            description: Seconds left before the automatic log and DNS-log recorders stop, 0 while a stream is open or nothing is attached. The flow-demand grace is not reported.
      geodata:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSettings
        description: Geodata download sources and automatic updates. Present when resources.geodata.configurable_sources is true. URLs are returned as written only to an authenticated caller with control and redacted for everyone else.
  RuntimeSettingsPatch:
    type: object
    additionalProperties: false
    minProperties: 1
    properties:
      record_flows:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
      record_logs:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
      record_dns_log:
        $ref: ./openapi.yaml#/components/schemas/RecorderMode
      log:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          level:
            $ref: ./openapi.yaml#/components/schemas/LogLevel
          buffered_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 64
      dns_log:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          max_records:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 64
      flows:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          max_flows:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 64
          retention_seconds:
            $ref: ./openapi.yaml#/components/schemas/SafeUInt
            minimum: 1
      geodata:
        $ref: ./openapi.yaml#/components/schemas/GeoDataSettingsPatch
